services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://finops:finops@db:5432/finops_rag
      CHROMA_PERSIST_DIR: /data/chroma
      UPLOAD_DIR: /data/uploads
      FIXTURES_DIR: /fixtures
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - finops_data:/data
      - ./fixtures:/fixtures:ro
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finops_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api

volumes:
  finops_data:
  postgres_data:
