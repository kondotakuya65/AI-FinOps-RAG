services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://finops:finops@db:5432/finops_rag
      CHROMA_PERSIST_DIR: /data/chroma
      UPLOAD_DIR: /data/uploads
    volumes:
      - finops_data:/data
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finops_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # frontend: added when Next.js app is scaffolded
  # ollama: use host Ollama or `docker compose --profile ollama`

volumes:
  finops_data:
  postgres_data:
